<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG 용사 길드 관리 시스템</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            padding: 20px; 
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #334155;
        }
        .header h1 { color: #f59e0b; font-size: 28px; }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 850px) {
            .layout-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        /* 폼 스타일 */
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; color: #cbd5e1; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: #fff; 
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #38bdf8; }

        .btn-submit { 
            width: 100%; 
            padding: 12px; 
            background: #e11d48; 
            border: none; 
            color: white; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #f43f5e; }

        /* 검색 박스 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-box input { flex: 1; }
        .btn-search {
            padding: 10px 20px;
            background: #0284c7;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-search:hover { background: #0369a1; }

        /* 테이블 스타일 */
        .table-container { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
        }
        th { background-color: #0f172a; color: #f59e0b; }
        tr:hover { background-color: #334155; }

        .badge-level {
            background-color: #854d0e;
            color: #fef08a;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
        }
        
        .empty-row {
            text-align: center;
            color: #94a3b8;
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚔️ RPG 용사 길드 명부 관리 시스템</h1>
    </div>

    <div class="layout-grid">
        <!-- 1. 신규 용사 등록 폼 -->
        <div class="card">
            <h2>➕ 신규 용사 등록</h2>
            <form id="heroForm">
                <div class="form-group">
                    <label>용사 닉네임 *</label>
                    <input type="text" id="nickname" required placeholder="예: 광기의검사">
                </div>
                <div class="form-group">
                    <label>직업군 *</label>
                    <input type="text" id="jobclass" required placeholder="예: 전사">
                </div>
                <div class="form-group">
                    <label>현재 레벨</label>
                    <input type="number" id="level" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>주력 스킬</label>
                    <input type="text" id="mainskill" placeholder="예: 회오리 베기">
                </div>
                <div class="form-group">
                    <label>전술 배치 포지션</label>
                    <input type="text" id="tacticalpos" placeholder="예: 최전방 돌격">
                </div>
                <button type="button" class="btn-submit" onclick="submitHero()">길드 명부에 등록</button>
            </form>
        </div>

        <!-- 2. 길드원 목록 및 검색 -->
        <div class="card">
            <h2>📜 길드원 명부 조회</h2>
            
            <div class="search-box">
                <input type="text" id="searchKeyword" placeholder="별명 또는 직업군 검색어 입력..." onkeyup="if(event.key === 'Enter') loadHeroes()">
                <button type="button" class="btn-search" onclick="loadHeroes()">검색</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>닉네임</th>
                            <th>직업군</th>
                            <th>레벨</th>
                            <th>주력 스킬</th>
                            <th>포지션</th>
                        </tr>
                    </thead>
                    <tbody id="heroTableBody">
                        <!-- API 연동을 통해 동적으로 추가됨 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 전체 용사 목록 자동 조회
        document.addEventListener('DOMContentLoaded', () => {
            loadHeroes();
        });

        // 1. 용사 목록 및 검색 API 연동 (/api/heroes)
        async function loadHeroes() {
            const keyword = document.getElementById('searchKeyword').value;
            const tableBody = document.getElementById('heroTableBody');

            try {
                const response = await fetch(`/api/heroes?keyword=${encodeURIComponent(keyword)}`);
                const result = await response.json();

                if (result.status === "success") {
                    renderHeroTable(result.data);
                } else {
                    alert('목록 조회 중 오류가 발생했습니다: ' + result.message);
                }
            } catch (error) {
                console.error("Error loading heroes:", error);
                alert("서버 통신 실패 (API 서버가 실행중인지 확인해주세요)");
            }
        }

        // 테이블 렌더링 함수
        function renderHeroTable(heroes) {
            const tableBody = document.getElementById('heroTableBody');
            tableBody.innerHTML = '';

            if (heroes.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="empty-row">조건에 맞는 용사가 존재하지 않습니다.</td></tr>`;
                return;
            }

            heroes.forEach(hero => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${hero.hero_id}</td>
                    <td><strong>${hero.nickname}</strong></td>
                    <td>${hero.job_class}</td>
                    <td><span class="badge-level">Lv.${hero.level}</span></td>
                    <td>${hero.main_skill || '-'}</td>
                    <td>${hero.tactical_position || '-'}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // 2. 신규 용사 등록 API 연동 (/api/addhero)
        async function submitHero() {
            const nickname = document.getElementById('nickname').value.trim();
            const jobclass = document.getElementById('jobclass').value.trim();
            const level = document.getElementById('level').value;
            const mainskill = document.getElementById('mainskill').value.trim();
            const tacticalpos = document.getElementById('tacticalpos').value.trim();

            if (!nickname || !jobclass) {
                alert('닉네임과 직업군은 필수 입력 사항입니다.');
                return;
            }

            // GET Query String 생성
            const queryParams = new URLSearchParams({
                nickname: nickname,
                jobclass: jobclass,
                level: level,
                mainskill: mainskill,
                tacticalpos: tacticalpos
            });

            try {
                const response = await fetch(`/api/addhero?${queryParams.toString()}`);
                const result = await response.json();

                if (result.status === "success") {
                    alert(`[성공] ${result.message}`);
                    document.getElementById('heroForm').reset();
                    document.getElementById('level').value = 1; // 기본값 초기화
                    
                    // 등록 성공 후 목록 즉시 새로고침
                    loadHeroes();
                } else {
                    alert(`[오류] 등록 실패: ${result.message}`);
                }
            } catch (error) {
                console.error("Error adding hero:", error);
                alert("서버 통신 오류가 발생했습니다.");
            }
        }
    </script>
</body>
</html>
