<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사원 정보 검색</title>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .search-box {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .search-box input {
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search-box button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .search-box button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        .no-data {
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>

    <h2>사원 정보 검색</h2>

    <!-- 검색 조건 입력 폼 -->
    <div class="search-box">
        <label for="ename">사원명: </label>
        <input type="text" id="ename" placeholder="사원명 입력">
        
        <label for="job">직책: </label>
        <input type="text" id="job" placeholder="직책 입력">
        
        <button type="button" id="searchBtn">검색</button>
    </div>

    <!-- 결과 출력 테이블 -->
    <table>
        <thead>
            <tr>
                <th>사원번호</th>
                <th>사원명</th>
                <th>직책</th>
                <th>급여</th>
                <th>입사일</th>
            </tr>
        </thead>
        <tbody id="empTableBody">
            <tr>
                <td colspan="5" class="no-data">검색어를 입력하거나 검색 버튼을 누르세요.</td>
            </tr>
        </tbody>
    </table>

    <script>
        $(document.body).ready(function() {
            // 사원 목록 조회 함수
            function fetchEmps() {
                const ename = $("#ename").val();
                const job = $("#job").val();

                $.ajax({
                    url: "/api/emps",
                    type: "GET",
                    data: {
                        ename: ename,
                        job: job
                    },
                    dataType: "json",
                    success: function(response) {
                        const tbody = $("#empTableBody");
                        tbody.empty(); // 기존 데이터 초기화

                        if (!response || response.length === 0) {
                            tbody.append('<tr><td colspan="5" class="no-data">조회된 사원 정보가 없습니다.</td></tr>');
                            return;
                        }

                        // DB 반환 데이터 컬럼명에 맞게 필드명을 수정해서 사용하세요.
                        $.each(response, function(index, emp) {
                            const row = `
                                <tr>
                                    <td>${emp.empno ?? ''}</td>
                                    <td>${emp.ename ?? ''}</td>
                                    <td>${emp.job ?? ''}</td>
                                    <td>${emp.sal ? emp.sal.toLocaleString() : ''}</td>
                                    <td>${emp.hiredate ?? ''}</td>
                                </tr>
                            `;
                            tbody.append(row);
                        });
                    },
                    error: function(xhr, status, error) {
                        console.error("데이터 조회 실패:", error);
                        alert("사원 정보를 불러오는 중 오류가 발생했습니다.");
                    }
                });
            }

            // 페이지 로드시 전체 목록 자동 조회
            fetchEmps();

            // 검색 버튼 클릭 이벤트
            $("#searchBtn").on("click", function() {
                fetchEmps();
            });

            // 입력창 Enter 키 및 Keyup 이벤트 (실시간 검색)
            $("#ename, #job").on("keyup", function(e) {
                if (e.key === "Enter") {
                    fetchEmps();
                }
            });
        });
    </script>
</body>
</html>
